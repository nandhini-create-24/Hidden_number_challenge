<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guess The Number Game</title>

    <!-- Bootstrap CSS -->
    <link
        rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="Hidden_number.css">
</head>

<body>

    <div class="container-fluid bg-container">

        <div class="row bg-white">

            <div class="col-12 col-md-6 m-auto bg-white pt-5 pb-5">

                <img
                    class="guess-game-img"
                    src="https://d2clawv67efefq.cloudfront.net/ccbp-dynamic-webapps/guess-game-img.png"
                    alt="Guess Game"
                >

                <p class="text-center game-description">
                    Find out the right number between 1 to 100
                </p>

            </div>
        </div>

        <div class="row">

            <div class="col-12 guess-bg-container text-center">

                <h1 class="guess-heading">
                    Guess The Number

                    <img
                        class="guess-number-image"
                        src="https://d2clawv67efefq.cloudfront.net/ccbp-dynamic-webapps/guess-number-img.png"
                        alt="Number"
                    >
                </h1>

                <input
                    type="number"
                    class="user-input"
                    id="userInput"
                    placeholder="Enter number"
                >
   
                <div>
                    <button
                        class="btn btn-info check-guess"
                        onclick="checkGuess()"
                    >
                        Check
                    </button>                
                    
                </div>

                <p class="game-result" id="gameResult"></p>

            </div>

        </div>

    </div>

    <!-- Custom JavaScript -->
    <script src="hidden_number.js"></script>

</body>
</html>
